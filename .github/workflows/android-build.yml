name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore fixed debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: .github/scripts/gradle.sh assembleDebug

      - name: Unit tests and coverage
        run: .github/scripts/gradle.sh koverXmlReport koverHtmlReport --continue

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('build/reports/kover/report.xml').getroot()
          names = {'LINE': 'Líneas', 'INSTRUCTION': 'Instrucciones', 'BRANCH': 'Ramas'}
          parts = []
          for counter in root.findall('counter'):
              kind = counter.get('type')
              if kind in names:
                  missed, covered = int(counter.get('missed')), int(counter.get('covered'))
                  parts.append(f"{names[kind]} {100 * covered / (missed + covered):.2f} %")
          summary = ' · '.join(parts)
          print(f'::notice title=Cobertura::{summary}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'### Cobertura\n\n{summary}\n')
          PY

      - name: Coverage minimum (Kover)
        run: .github/scripts/gradle.sh koverVerify

      - name: Android Lint
        run: .github/scripts/gradle.sh lintDebug --continue

      - name: Kotlin style (ktlint)
        run: |
          encode() { sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if ./gradlew ktlintCheck --continue --console=plain > "$RUNNER_TEMP/ktlint.log" 2>&1; then
            echo "::notice title=ktlint::Sin infracciones de estilo"
            exit 0
          fi
          reports=$(find . -path '*/build/reports/ktlint/*' -name '*.txt' -size +0c)
          if [ -n "$reports" ]; then
            summary=$(cat $reports | sed 's/\x1b\[[0-9;]*m//g' | sed -nE 's/.*\(([a-z_]+:[a-z0-9_-]+)\)[[:space:]]*$/\1/p' | sort | uniq -c | sort -rn | head -30 | encode)
            details=$(cat $reports | sed 's/\x1b\[[0-9;]*m//g' | sed -E 's#^.*/(app|core|feature|build-logic)/#\1/#' | head -20 | encode)
            summary="${summary}%0A%0A${details}"
          else
            summary=$(tail -40 "$RUNNER_TEMP/ktlint.log" | encode)
          fi
          echo "::warning title=ktlint - infracciones por regla::${summary:-sin detalle}"
          exit 1

      - name: Static analysis (detekt)
        env:
          DETEKT_VERSION: 1.23.8
        run: |
          encode() { sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          mkdir -p build/reports/detekt
          curl -sSfL -o "$RUNNER_TEMP/detekt.jar" "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          if java -jar "$RUNNER_TEMP/detekt.jar" --build-upon-default-config --config config/detekt/detekt.yml \
              --input app,core,feature,build-logic --excludes '**/build/**' \
              --report txt:build/reports/detekt/detekt.txt --report html:build/reports/detekt/detekt.html; then
            echo "::notice title=detekt::Sin hallazgos"
            exit 0
          fi
          summary=$(sed -E 's#/home/runner/work/[^/]+/[^/]+/##' build/reports/detekt/detekt.txt | head -30 | encode)
          echo "::warning title=detekt - hallazgos::${summary:-sin detalle}"
          exit 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/
            build/reports/detekt/
            build/reports/kover/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MenuPlanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: .github/scripts/gradle.sh bundleRelease

      - name: Upload release AAB
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: MenuPlanner-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish APK as 'debug-latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MenuPlanner-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest MenuPlanner-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MenuPlanner debug (último build)" \
            --notes "APK de pruebas generada automáticamente desde el commit ${GITHUB_SHA::7}."
